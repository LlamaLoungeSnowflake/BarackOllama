[project]
name = "barackollama"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "composio>=0.11.1",
    "composio-crewai>=0.11.1",
    "crewai>=1.9.3",
    "fastapi>=0.134.0",
    "uvicorn>=0.34.0",
    "litellm>=1.30.0",
    "python-dotenv>=1.0.0",
    "weasyprint>=68.1",
    "copilotkit[crewai]>=0.1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barackollama"]
